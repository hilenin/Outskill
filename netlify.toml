# Netlify config — app lives at the repo root, leave Base directory empty
[build]
  command = "npm run build"
  publish = "dist"

# Vite 8 requires Node ^20.19.0 || >=22.12.0
[build.environment]
  NODE_VERSION = "22"

# SPA fallback: deep links like /reset-password and /result/:id must serve
# index.html so react-router can handle them (otherwise refresh = 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
